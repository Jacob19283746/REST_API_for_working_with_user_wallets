[project]
name = "rest-api-for-working-with-user-wallets"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.9"
dependencies = [
    "aiosqlite>=0.19.0",
    "alembic[asyncio]>=1.16.5",
    "asyncpg>=0.29.0",
    "cookiecutter>=2.6.0",
    "fastapi>=0.128.8",
    "gunicorn>=21.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.12.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.39.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]
